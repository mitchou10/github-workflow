# Copy to .github/workflows/ci.yml in your project.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  lint:
    uses: Mitchou10/github-workflow/.github/workflows/python-lint.yml@v0
    permissions:
      contents: read
    # with:
    #   WORKING_DIRECTORY: backend   # default: repository root
    #   RUFF_VERSION: "0.9.10"       # default: latest
    #   RULES: "E,F,I,UP,B,SIM"      # default: E,F,I,UP,B (only if no project config)
    #   IGNORE: "E501"
    #   LINE_LENGTH: "100"           # default: 120 (only if no project config)
    #   CONFIG_FILE: ci/ruff.toml    # force a config file
    #   FORMAT_CHECK: false

  typecheck:
    uses: Mitchou10/github-workflow/.github/workflows/python-typecheck.yml@v0
    permissions:
      contents: read
    # with:
    #   WORKING_DIRECTORY: backend   # default: repository root
    #   TYPE_CHECKER: pyright        # ty | mypy | pyright, default: ty
    #   TARGET: app                  # default: .
    #   SYNC_ARGS: --group dev       # default: --all-groups

  deadcode:
    uses: Mitchou10/github-workflow/.github/workflows/python-deadcode.yml@v0
    permissions:
      contents: read
    # with:
    #   WORKING_DIRECTORY: backend       # default: repository root
    #   PATHS: "app migrations"          # default: .
    #   MIN_CONFIDENCE: "60"             # default: 80 (only if no project config)
    #   EXCLUDE: "*/migrations/*"
    #   IGNORE_NAMES: "visit_*,Meta"
    #   IGNORE_DECORATORS: "@app.route,@pytest.fixture"
    #   WHITELIST: whitelist.py
