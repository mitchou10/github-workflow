# Copy to .github/workflows/lint-helm.yml in your project (or add the job to your CI).
name: Lint Helm

on:
  pull_request:
    paths:
      - "helm/**"          # adapt to your chart directory

jobs:
  lint-helm:
    uses: Mitchou10/github-workflow/.github/workflows/lint-helm.yml@v0
    permissions:
      contents: read
    # with:
    #   CHART_DIRS: charts                 # default: . (chart in a subdirectory such as helm/)
    #   CHART_REPOS: "bitnami=https://charts.bitnami.com/bitnami"
    #   ONLY_CHANGED: true                 # lint only the charts changed by the PR
    #   CHECK_VERSION_INCREMENT: true      # require a chart version bump
    #   LINT_DOCS: true                    # README generated by helm-docs is up to date
    #   DOCS_DIR: helm
    #   CT_CONF_PATH: ci/ct.yaml           # your own chart-testing config
