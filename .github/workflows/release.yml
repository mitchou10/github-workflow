name: Release

# Versions this repository itself, using its own reusable workflows.
# main = stable releases (vX.Y.Z), dev = release candidates (vX.Y.Z-rc.N).

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      ENABLE_PRERELEASE: true
      # Callers pin `@v0` (or `@v0.1`): keep those tags moving (main only).
      TAG_MAJOR_AND_MINOR: true

  # Last on purpose: a release lands commits on main that dev must receive.
  sync-prerelease-branch:
    needs: release
    if: ${{ github.ref_name == 'main' && needs.release.outputs.release-created == 'true' }}
    uses: ./.github/workflows/sync-prerelease-branch.yml
    permissions:
      contents: write
