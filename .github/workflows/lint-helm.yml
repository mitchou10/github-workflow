name: Lint Helm

# Reusable workflow: lints Helm charts with chart-testing (`ct lint`, which
# runs `helm lint`, yamllint and the Chart.yaml schema checks), and optionally
# checks that the chart README generated by helm-docs is up to date.
#
# chart-testing looks for charts in the SUBDIRECTORIES of CHART_DIRS: with the
# default `.`, a chart in `helm/Chart.yaml` is found; a chart whose Chart.yaml
# sits at the repository root is not. Use a chart directory such as `charts`
# or `helm` to keep charts in one place.
#
# Values files in `<chart>/ci/*-values.yaml` are linted too: use them to
# exercise the optional parts of the chart.

on:
  workflow_call:
    inputs:
      CHART_DIRS:
        description: Comma-separated directories whose subdirectories are charts
        type: string
        required: false
        default: .
      CHART_REPOS:
        description: >-
          Repositories of the chart dependencies, comma separated, as
          name=url (for example bitnami=https://charts.bitnami.com/bitnami).
          OCI dependencies need no entry.
        type: string
        required: false
        default: ""
      CT_CONF_PATH:
        description: >-
          Your own chart-testing configuration file. When set, CHART_DIRS,
          CHART_REPOS, CHECK_VERSION_INCREMENT and VALIDATE_MAINTAINERS are
          ignored: the file decides.
        type: string
        required: false
        default: ""
      ONLY_CHANGED:
        description: Lint only the charts changed since TARGET_BRANCH, instead of all of them
        type: boolean
        required: false
        default: false
      TARGET_BRANCH:
        description: Branch to compare with when ONLY_CHANGED is set. Empty means the pull request base, else the default branch.
        type: string
        required: false
        default: ""
      CHECK_VERSION_INCREMENT:
        description: Require the chart version to be bumped compared with TARGET_BRANCH
        type: boolean
        required: false
        default: false
      VALIDATE_MAINTAINERS:
        description: Require the maintainers of Chart.yaml to be valid GitHub users
        type: boolean
        required: false
        default: false
      HELM_VERSION:
        description: Helm version (for example v3.19.0)
        type: string
        required: false
        default: latest
      LINT_DOCS:
        description: Also check that the README generated by helm-docs is up to date
        type: boolean
        required: false
        default: false
      DOCS_DIR:
        description: Directory searched for charts by helm-docs
        type: string
        required: false
        default: .
      HELM_DOCS_VERSION:
        description: helm-docs version
        type: string
        required: false
        # renovate: datasource=github-releases depName=norwoodj/helm-docs
        default: v1.14.2
      RUNS_ON:
        description: Runner labels as JSON array
        type: string
        required: false
        default: '["ubuntu-24.04"]'

jobs:
  lint-charts:
    name: Lint charts
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # ct compares with the target branch to find changed charts.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ inputs.HELM_VERSION }}

      # chart-testing runs yamllint and yamale, which are Python tools.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

      - name: Lint charts
        env:
          CHART_DIRS: ${{ inputs.CHART_DIRS }}
          CHART_REPOS: ${{ inputs.CHART_REPOS }}
          CT_CONF_PATH: ${{ inputs.CT_CONF_PATH }}
          ONLY_CHANGED: ${{ inputs.ONLY_CHANGED }}
          CHECK_VERSION_INCREMENT: ${{ inputs.CHECK_VERSION_INCREMENT }}
          VALIDATE_MAINTAINERS: ${{ inputs.VALIDATE_MAINTAINERS }}
          TARGET_BRANCH: ${{ inputs.TARGET_BRANCH || github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          args=(lint)

          if [ -n "$CT_CONF_PATH" ]; then
            args+=(--config "$CT_CONF_PATH")
          else
            args+=(--chart-dirs "$CHART_DIRS")
            [ -z "$CHART_REPOS" ] || args+=(--chart-repos "$CHART_REPOS")
            args+=("--check-version-increment=$CHECK_VERSION_INCREMENT")
            args+=("--validate-maintainers=$VALIDATE_MAINTAINERS")
          fi

          if [ "$ONLY_CHANGED" = "true" ]; then
            args+=(--target-branch "$TARGET_BRANCH")
          else
            args+=(--all)
          fi

          ct "${args[@]}"

  lint-docs:
    name: Lint chart docs
    if: ${{ inputs.LINT_DOCS }}
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Regenerates the READMEs in place, then fails if that changed anything:
      # the committed README no longer matches the chart values.
      - name: Check helm-docs output
        env:
          DOCS_DIR: ${{ inputs.DOCS_DIR }}
          HELM_DOCS_VERSION: ${{ inputs.HELM_DOCS_VERSION }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/helm-docs" \
            -u "$(id -u)" \
            "docker.io/jnorwood/helm-docs:$HELM_DOCS_VERSION" \
            --chart-search-root "$DOCS_DIR"

          if [ -n "$(git status --porcelain -- "$DOCS_DIR")" ]; then
            git --no-pager diff -- "$DOCS_DIR"
            echo "::error::The chart docs are out of date. Run helm-docs and commit the result."
            exit 1
          fi
