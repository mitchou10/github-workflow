name: CI

# Checks this repository's own pull requests with its own reusable workflows.

on:
  pull_request:
    branches: [main, dev]
    # `edited`: a renamed pull request title is linted again.
    types: [opened, synchronize, reopened, edited]

jobs:
  lint-commits:
    uses: ./.github/workflows/lint-commits.yml
    permissions:
      contents: read
    with:
      LINT_PR_TITLE: true

  # The only check to require in the branch protection: it goes green when
  # every job listed in `needs` did.
  gate:
    if: ${{ always() }}
    needs: [lint-commits]
    uses: ./.github/workflows/status-gate.yml
    with:
      NEEDS: ${{ toJSON(needs) }}
