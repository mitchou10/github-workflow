name: Python typecheck

# Reusable workflow: ty (default), mypy or pyright over a uv-managed project.
# Runs at the repository root by default; set WORKING_DIRECTORY for a
# sub-project (monorepo). Project dependencies are installed first so imports
# resolve; the checker itself is added on the fly and need not be a dependency.

on:
  workflow_call:
    inputs:
      WORKING_DIRECTORY:
        description: Directory of the project to check (relative to the repository root)
        type: string
        required: false
        default: .
      PYTHON_VERSION:
        description: Python version used to run the checker
        type: string
        required: false
        default: "3.12"
      TYPE_CHECKER:
        description: "Type checker to run: ty, mypy or pyright"
        type: string
        required: false
        default: ty
      TARGET:
        description: Path passed to the checker, relative to WORKING_DIRECTORY
        type: string
        required: false
        default: .
      SYNC_ARGS:
        description: Arguments for `uv sync` (e.g. `--group dev`, `--extra foo`)
        type: string
        required: false
        default: --all-groups
      EXTRA_ARGS:
        description: Extra arguments passed to the checker
        type: string
        required: false
        default: ""
      RUNS_ON:
        description: Runner labels as JSON array
        type: string
        required: false
        default: '["ubuntu-24.04"]'

jobs:
  typecheck:
    name: Typecheck (${{ inputs.TYPE_CHECKER }})
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
    steps:
      - name: Validate inputs
        env:
          TYPE_CHECKER: ${{ inputs.TYPE_CHECKER }}
        run: |
          case "$TYPE_CHECKER" in
            ty|mypy|pyright) ;;
            *) echo "::error::TYPE_CHECKER must be 'ty', 'mypy' or 'pyright', got '$TYPE_CHECKER'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.WORKING_DIRECTORY }}/uv.lock

      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.SYNC_ARGS }}
        # Unquoted on purpose: SYNC_ARGS holds several arguments.
        run: uv sync $SYNC_ARGS

      - name: Typecheck
        env:
          TYPE_CHECKER: ${{ inputs.TYPE_CHECKER }}
          TARGET: ${{ inputs.TARGET }}
          EXTRA_ARGS: ${{ inputs.EXTRA_ARGS }}
        run: |
          # ty is invoked as `ty check`, the others take the target directly.
          sub=()
          [ "$TYPE_CHECKER" != "ty" ] || sub=(check)
          uv run --with "$TYPE_CHECKER" "$TYPE_CHECKER" "${sub[@]}" $EXTRA_ARGS "$TARGET"
