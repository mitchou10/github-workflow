name: Python lint

# Reusable workflow: ruff check + ruff format --check.
# Runs at the repository root by default; set WORKING_DIRECTORY for a
# sub-project (monorepo). Ruff reads its config (pyproject.toml / ruff.toml)
# from that directory, and is run through uvx, so nothing has to be installed.
#
# Rules:
#   - the project has its own ruff config (ruff.toml, .ruff.toml or a
#     [tool.ruff] table in pyproject.toml): it is used as is;
#   - otherwise the defaults below apply (RULES, LINE_LENGTH);
#   - RULES / IGNORE / LINE_LENGTH / CONFIG_FILE, when set, always win.

on:
  workflow_call:
    inputs:
      WORKING_DIRECTORY:
        description: Directory to lint (relative to the repository root)
        type: string
        required: false
        default: .
      PYTHON_VERSION:
        description: Python version used to run ruff
        type: string
        required: false
        default: "3.12"
      RUFF_VERSION:
        description: Ruff version to run (e.g. 0.9.10). Empty uses the latest release.
        type: string
        required: false
        default: ""
      CONFIG_FILE:
        description: Ruff config file to use instead of any project or default config (relative to WORKING_DIRECTORY)
        type: string
        required: false
        default: ""
      RULES:
        description: >-
          Comma-separated rule selectors (ruff --select). Empty: the project's
          config, or E,F,I,UP,B when it has none.
        type: string
        required: false
        default: ""
      IGNORE:
        description: Comma-separated rules to ignore (ruff --ignore)
        type: string
        required: false
        default: ""
      LINE_LENGTH:
        description: Line length. Empty - the project's config, or 120 when it has none.
        type: string
        required: false
        default: ""
      FORMAT_CHECK:
        description: Also run `ruff format --check`
        type: boolean
        required: false
        default: true
      RUNS_ON:
        description: Runner labels as JSON array
        type: string
        required: false
        default: '["ubuntu-24.04"]'

jobs:
  ruff:
    name: Ruff
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
    env:
      DEFAULT_RULES: E,F,I,UP,B
      DEFAULT_LINE_LENGTH: "120"
      CONFIG_FILE: ${{ inputs.CONFIG_FILE }}
      RULES: ${{ inputs.RULES }}
      IGNORE: ${{ inputs.IGNORE }}
      LINE_LENGTH: ${{ inputs.LINE_LENGTH }}
      RUFF: ruff${{ inputs.RUFF_VERSION != '' && format('=={0}', inputs.RUFF_VERSION) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}

      - name: Ruff
        env:
          FORMAT_CHECK: ${{ inputs.FORMAT_CHECK }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$CONFIG_FILE" ]; then
            args+=(--config "$CONFIG_FILE")
          elif [ -f ruff.toml ] || [ -f .ruff.toml ] || { [ -f pyproject.toml ] && grep -q '^\[tool\.ruff' pyproject.toml; }; then
            echo "Using the project's ruff configuration"
          else
            echo "No ruff configuration found, applying defaults"
            RULES="${RULES:-$DEFAULT_RULES}"
            LINE_LENGTH="${LINE_LENGTH:-$DEFAULT_LINE_LENGTH}"
          fi
          [ -z "$LINE_LENGTH" ] || args+=(--line-length "$LINE_LENGTH")

          # --select / --ignore are lint options: `ruff format` rejects them.
          lint_args=("${args[@]}")
          [ -z "$RULES" ] || lint_args+=(--select "$RULES")
          [ -z "$IGNORE" ] || lint_args+=(--ignore "$IGNORE")

          echo "::group::ruff check"
          uvx "$RUFF" check "${lint_args[@]}" .
          echo "::endgroup::"

          if [ "$FORMAT_CHECK" = "true" ]; then
            echo "::group::ruff format --check"
            uvx "$RUFF" format --check "${args[@]}" .
            echo "::endgroup::"
          fi
