name: Build Docker

# Reusable workflow: builds a container image with buildx and pushes it to a
# registry (GitHub Container Registry by default).
#
# Tags: IMAGE_TAG (typically the release version), plus optionally `latest`,
# the floating major and minor tags, and a short-sha tag.
#
# Permissions: the job declares none, so it gets those of the calling job.
# Grant `contents: read` and, to push to ghcr.io, `packages: write`.
#
# Build several images with a matrix in the caller; each gets its own cache.

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        description: >-
          Image name without tag, for example ghcr.io/owner/app. Empty means
          ghcr.io/<owner>/<repository>, lower-cased.
        type: string
        required: false
        default: ""
      IMAGE_TAG:
        description: Main tag, typically the release version (for example 1.2.3). Empty means sha-<short sha>.
        type: string
        required: false
        default: ""
      LATEST_TAG:
        description: Also tag the image `latest`
        type: boolean
        required: false
        default: false
      TAG_MAJOR_AND_MINOR:
        description: Also tag the floating `X.Y` and `X` (skipped for prereleases such as 1.2.3-rc.1)
        type: boolean
        required: false
        default: false
      TAG_SHORT_SHA:
        description: Also tag sha-<short sha>
        type: boolean
        required: false
        default: false
      CONTEXT:
        description: Build context
        type: string
        required: false
        default: .
      DOCKERFILE:
        description: Path to the Dockerfile. Empty means <CONTEXT>/Dockerfile.
        type: string
        required: false
        default: ""
      TARGET:
        description: Target stage of a multi-stage Dockerfile
        type: string
        required: false
        default: ""
      PLATFORMS:
        description: Comma-separated platforms, for example linux/amd64,linux/arm64
        type: string
        required: false
        default: linux/amd64
      BUILD_ARGS:
        description: Build arguments, one KEY=value per line
        type: string
        required: false
        default: ""
      PUSH:
        description: Push the image. When false, the image is only built (a check that the Dockerfile builds).
        type: boolean
        required: false
        default: true
      CACHE:
        description: Use the GitHub Actions cache for the layers
        type: boolean
        required: false
        default: true
      CACHE_MODE:
        description: "`min` caches the final layers, `max` all of them (faster rebuilds, bigger cache)"
        type: string
        required: false
        default: min
      PROVENANCE:
        description: Attach a provenance attestation (off by default, it adds an untagged manifest to the registry)
        type: boolean
        required: false
        default: false
      RUNS_ON:
        description: Runner labels as JSON array
        type: string
        required: false
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: Registry username. Empty means the GitHub actor (ghcr.io).
        required: false
      REGISTRY_PASSWORD:
        description: Registry password or token. Empty means the job token (ghcr.io).
        required: false
      BUILD_SECRETS:
        description: Build secrets, one id=value per line, read in the Dockerfile with RUN --mount=type=secret
        required: false
    outputs:
      image:
        description: Image name without tag
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Digest of the pushed image (sha256:...)
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: Tags applied, one per line
        value: ${{ jobs.build.outputs.tags }}

jobs:
  build:
    name: Build ${{ inputs.IMAGE_NAME || github.event.repository.name }}
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Validate and resolve inputs
        id: vars
        env:
          IMAGE_NAME: ${{ inputs.IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
          CACHE_MODE: ${{ inputs.CACHE_MODE }}
          TAG_MAJOR_AND_MINOR: ${{ inputs.TAG_MAJOR_AND_MINOR }}
          LATEST_TAG: ${{ inputs.LATEST_TAG }}
          TAG_SHORT_SHA: ${{ inputs.TAG_SHORT_SHA }}
          PLATFORMS: ${{ inputs.PLATFORMS }}
        run: |
          set -euo pipefail

          case "$CACHE_MODE" in
            min|max) ;;
            *) echo "::error::CACHE_MODE must be 'min' or 'max', got '$CACHE_MODE'"; exit 1 ;;
          esac

          image="${IMAGE_NAME:-ghcr.io/$GITHUB_REPOSITORY}"
          # Registries require lower-case repository names.
          image="${image,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "registry=${image%%/*}" >> "$GITHUB_OUTPUT"
          # Cache scope: one per image, so a matrix of images does not share layers.
          echo "scope=$(printf '%s' "$image" | tr -c 'a-z0-9' '-')" >> "$GITHUB_OUTPUT"

          tag="${IMAGE_TAG:-sha-${GITHUB_SHA::7}}"

          # One metadata-action tag rule per line. Built here rather than with
          # `enable=` flags in the step: an empty value there fails the parsing.
          {
            echo "tags<<EOF"
            echo "type=raw,value=$tag"
            [ "$LATEST_TAG" != "true" ] || echo "type=raw,value=latest"
            [ "$TAG_SHORT_SHA" != "true" ] || echo "type=sha,prefix=sha-,format=short"
            # Floating tags only make sense for a plain X.Y.Z release.
            if [ "$TAG_MAJOR_AND_MINOR" = "true" ]; then
              if [[ "$tag" =~ ^v?([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
                echo "type=raw,value=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
                echo "type=raw,value=${BASH_REMATCH[1]}"
              else
                echo "::notice::'$tag' is not a stable X.Y.Z version, the major and minor tags are skipped." >&2
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # QEMU is only needed to build for another architecture than the runner's.
          if [[ "$PLATFORMS" =~ arm|riscv|s390x|ppc64le|386 ]]; then
            echo "qemu=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        if: ${{ steps.vars.outputs.qemu == 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to the registry
        if: ${{ inputs.PUSH }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ steps.vars.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      # Also adds the OCI labels (source, revision, version, created).
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: ${{ steps.vars.outputs.tags }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.CONTEXT }}
          file: ${{ inputs.DOCKERFILE }}
          target: ${{ inputs.TARGET }}
          platforms: ${{ inputs.PLATFORMS }}
          build-args: ${{ inputs.BUILD_ARGS }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          push: ${{ inputs.PUSH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ inputs.PROVENANCE }}
          cache-from: ${{ inputs.CACHE && format('type=gha,scope={0}', steps.vars.outputs.scope) || '' }}
          cache-to: ${{ inputs.CACHE && format('type=gha,scope={0},mode={1}', steps.vars.outputs.scope, inputs.CACHE_MODE) || '' }}

      - name: Summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ inputs.PUSH }}
        run: |
          {
            echo "### Image \`$IMAGE\`"
            if [ "$PUSHED" = "true" ]; then echo "Pushed, digest \`$DIGEST\`."; else echo "Built, not pushed."; fi
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
